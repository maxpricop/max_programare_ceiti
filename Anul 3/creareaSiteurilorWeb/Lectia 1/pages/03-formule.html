<!doctype html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Exercițiul 3 - Formule matematice</title>
        <link rel="stylesheet" href="../css/base.css">
        <link rel="stylesheet" href="../css/formule.css">
    </head>
    <body>
        <!-- Început: navigare -->
        <nav aria-label="Navigare"><a href="../index.html">Înapoi la cuprins</a></nav>
        <!-- Sfârșit: navigare -->

        <main>
            <!-- Început: formule centrate, cu indici și exponenți -->
            <section class="formule" aria-labelledby="titlu-formule">
                <h1 id="titlu-formule">Formule matematice</h1>
                <p>a) (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup>;</p>
                <p>
                    b) (a<sub>1</sub>
                    + a<sub>2</sub>
                    + a<sub>3</sub>)<sup>2</sup>
                    = a<sub>1</sub><sup>2</sup>
                    + a<sub>2</sub><sup>2</sup>
                    + a<sub>3</sub><sup>2</sup>
                    + 2a<sub>1</sub>a<sub>2</sub>
                    + 2a<sub>1</sub>a<sub>3</sub>
                    + 2a<sub>2</sub>a<sub>3</sub>;
                </p>
                <p>c) |a + b| &lt; |a| + |b|, pentru orice numere nenule a și b.</p>
            </section>
            <!-- Sfârșit: formule centrate, cu indici și exponenți -->
        </main>
    </body>
